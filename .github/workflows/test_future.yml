name: Test - Future

on:
  push:
    branches: [ future ]

jobs:
  unittest:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-12]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Checkout future branch
      uses: actions/checkout@v4
      with:
        ref: future
        path: robotics-toolbox-python
        
    - name: Checkout Swift
      uses: actions/checkout@v4
      with:
        ref: future
        repository: jhavl/swift
        path: swift

    - name: Checkout Spatialmath
      uses: actions/checkout@v4
      with:
        ref: future
        repository: petercorke/spatialmath-python
        path: sm

    - name: Checkout Spatialgeometry
      uses: actions/checkout@v4
      with:
        repository: gaurishg/spatialgeometry
        path: sg
        
    - name: Install dependencies
      run: |
        echo "Update pip"
        python -m pip install --upgrade pip
        pip install -U build
        cd sm
        echo "Install sm"
        pip install .
        cd ../sg
        echo "Install sg"
        pip install .
        cd ../swift
        echo "Install swift"
        pip install .
        cd ../robotics-toolbox-python/rtb-data
        pip install .
    - name: Test with pytest
      run: |
        cd robotics-toolbox-python
        pip install -e .[dev,collision]
        pip install pytest-timeout
        python -m ruff check setup.py roboticstoolbox/tools/types.py tests/test_imports.py
        python -m mypy
        python -c "import spatialgeometry"
        python -c "import roboticstoolbox"
        pytest --ignore=roboticstoolbox/blocks --timeout=50 --timeout_method thread -s
